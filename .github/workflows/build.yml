name: Build Jarvis APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: jarvis.keystore
          key: jarvis-keystore-v1
      - name: Create signing key once
        run: |
          [ -f jarvis.keystore ] || keytool -genkeypair -keystore jarvis.keystore -storepass jarvis123 -keypass jarvis123 -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Jarvis"
      - name: Write Android project
        run: |
          mkdir -p proj/app/src/main/java/com/jarvis/app proj/app/src/main/assets
          cat > proj/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Jarvis'
          include ':app'
          EOF
          cat > proj/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF
          cat > proj/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.jarvis.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.jarvis.app'
              minSdk 29
              targetSdk 34
              versionCode 1000 + (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
              versionName '1.0'
            }
            signingConfigs { release { storeFile file('jarvis.keystore'); storePassword 'jarvis123'; keyAlias 'jarvis'; keyPassword 'jarvis123' } }
            buildTypes { release { signingConfig signingConfigs.release } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            lint { checkReleaseBuilds false; abortOnError false }
          }
          EOF
          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"> <uses-permission android:name="android.permission.INTERNET"/> <queries><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries> <application android:label="Jarvis" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.Material.Light.NoActionBar"> <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize" android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode"> <intent-filter> <action android:name="android.intent.action.MAIN"/> <category android:name="android.intent.category.LAUNCHER"/> </intent-filter> </activity> <service android:name=".JarvisAccess" android:exported="true" android:label="Jarvis phone control" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"> <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter> <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config"/> </service> </application> </manifest>
          EOF
          cat > proj/app/src/main/assets/inject.js <<'EOF'
          if(!window.__j){window.__j={els:[],
           snap(){this.els=[];const q='a[href],button,input,select,textarea,[role=button],[onclick]';const out=[];
            document.querySelectorAll(q).forEach(e=>{const r=e.getBoundingClientRect();if(r.width<2||r.height<2||getComputedStyle(e).visibility==='hidden'||this.els.length>=60)return;
             const t=(e.innerText||e.value||e.placeholder||e.getAttribute('aria-label')||e.title||'').trim().slice(0,60);
             this.els.push(e);out.push((this.els.length-1)+': '+e.tagName.toLowerCase()+(e.type?'['+e.type+']':'')+' '+t)});
            return 'URL: '+location.href+'\nTITLE: '+document.title+'\nTEXT: '+document.body.innerText.replace(/\s+/g,' ').slice(0,5000)+'\nELEMENTS:\n'+out.join('\n')},
           click(i){const e=this.els[i];if(!e)return 'No such element; read the page again.';e.scrollIntoView({block:'center'});e.click();return 'Clicked '+i},
           type(i,t,s){const e=this.els[i];if(!e)return 'No such element; read the page again.';if(e.type==='password')return 'Blocked: the user must type passwords themselves.';
            e.focus();const d=Object.getOwnPropertyDescriptor(Object.getPrototypeOf(e),'value');if(d&&d.set)d.set.call(e,t);else e.value=t;
            e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));
            if(s){if(e.form){if(e.form.requestSubmit)e.form.requestSubmit();else e.form.submit()}else e.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}))}
            return 'Typed into '+i},
           scroll(d){window.scrollBy(0,(d==='up'?-1:1)*innerHeight*0.8);return 'Scrolled '+d}}}
          EOF
          cat > proj/app/src/main/java/com/jarvis/app/MainActivity.java <<'EOF'
          package com.jarvis.app;
          import android.app.Activity;
          import android.content.*;
          import android.content.pm.*;
          import android.net.Uri;
          import android.os.*;
          import android.provider.MediaStore;
          import android.speech.RecognizerIntent;
          import android.speech.tts.*;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;
          import org.json.*;
          import java.io.*;
          import java.net.*;
          import java.util.*;

          public class MainActivity extends Activity {
            WebView ui, br; Button back; ValueCallback<Uri[]> chooser; String inj = "";
            Handler h = new Handler(Looper.getMainLooper()); int loadId = 0; TextToSpeech tts;

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              try { InputStream is = getAssets().open("inject.js"); byte[] bs = new byte[is.available()]; is.read(bs); is.close(); inj = new String(bs, "UTF-8") + ";"; } catch (Exception e) {}
              FrameLayout root = new FrameLayout(this);
              ui = mk(true); br = mk(false); br.setVisibility(View.GONE);
              back = new Button(this); back.setText("Back to Jarvis"); back.setVisibility(View.GONE);
              back.setOnClickListener(v -> show(false));
              root.addView(ui); root.addView(br);
              root.addView(back, new FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL));
              setContentView(root);
              ui.addJavascriptInterface(new Bridge(), "Android");
              tts = new TextToSpeech(this, st -> {
                if (st == TextToSpeech.SUCCESS) {
                  tts.setLanguage(Locale.getDefault());
                  tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                    @Override public void onStart(String id) {}
                    @Override public void onDone(String id) { js("window.onSpoken&&onSpoken()"); }
                    @Override public void onError(String id) { js("window.onSpoken&&onSpoken()"); }
                  });
                }
              });
              ui.loadUrl("file:///android_asset/index.html");
            }

            WebView mk(boolean main) {
              WebView w = new WebView(this); WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);
              if (main) { s.setAllowUniversalAccessFromFileURLs(true); s.setAllowFileAccessFromFileURLs(true); }
              w.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  String u = r.getUrl().toString();
                  if (u.startsWith("http") || u.startsWith("file:")) return false;
                  launch(u); return true;
                }
                @Override public void onPageFinished(WebView v, String u) {
                  if (v == br && loadId != 0) { int id = loadId; loadId = 0; snap(id, ""); }
                }
              });
              w.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  chooser = cb;
                  try { startActivityForResult(p.createIntent(), 2); } catch (Exception e) { chooser = null; return false; }
                  return true;
                }
              });
              return w;
            }

            void show(boolean s) { br.setVisibility(s ? View.VISIBLE : View.GONE); back.setVisibility(s ? View.VISIBLE : View.GONE); }

            @Override public void onBackPressed() {
              if (br.getVisibility() == View.VISIBLE) { if (br.canGoBack()) br.goBack(); else show(false); }
              else if (ui.canGoBack()) ui.goBack(); else super.onBackPressed();
            }

            void launch(String u) {
              try {
                Intent i = u.startsWith("intent:") ? Intent.parseUri(u, Intent.URI_INTENT_SCHEME) : new Intent(Intent.ACTION_VIEW, Uri.parse(u));
                i.setComponent(null); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(i);
              } catch (Exception e) { Toast.makeText(this, "Couldn't open that: " + e.getMessage(), Toast.LENGTH_LONG).show(); }
            }

            String unq(String v) { try { return String.valueOf(new JSONTokener(v).nextValue()); } catch (Exception e) { return String.valueOf(v); } }
            void js(String s) { h.post(() -> ui.evaluateJavascript(s, null)); }
            void res(int id, String r) { js("window.__bres(" + id + "," + JSONObject.quote(r) + ")"); }
            void snap(int id, String pre) { br.evaluateJavascript(inj + "window.__j.snap()", v -> res(id, pre + unq(v))); }
            void ev(int id, String code) {
              br.evaluateJavascript(inj + code, v -> { String p = unq(v) + "\n"; h.postDelayed(() -> snap(id, p), 1800); });
            }

            void doBrowse(int id, String cmd, String args) {
              try {
                JSONObject a = new JSONObject(args);
                switch (cmd) {
                  case "open": {
                    String u = a.getString("url"); if (!u.startsWith("http")) u = "https://" + u;
                    show(true); loadId = id; br.loadUrl(u);
                    h.postDelayed(() -> { if (loadId == id) { loadId = 0; snap(id, ""); } }, 15000); break; }
                  case "read": snap(id, ""); break;
                  case "click": ev(id, "window.__j.click(" + a.getInt("id") + ")"); break;
                  case "type": ev(id, "window.__j.type(" + a.getInt("id") + "," + JSONObject.quote(a.getString("text")) + "," + a.optBoolean("submit") + ")"); break;
                  case "scroll": ev(id, "window.__j.scroll(" + JSONObject.quote(a.optString("dir", "down")) + ")"); break;
                  case "back": br.goBack(); h.postDelayed(() -> snap(id, ""), 1500); break;
                  default: res(id, "Unknown browser command.");
                }
              } catch (Exception e) { res(id, "Error: " + e.getMessage()); }
            }

            String launchByName(String name) {
              PackageManager pm = getPackageManager();
              Intent q = new Intent(Intent.ACTION_MAIN); q.addCategory(Intent.CATEGORY_LAUNCHER);
              String nn = name.toLowerCase().trim(), best = null, bl = null;
              for (ResolveInfo ri : pm.queryIntentActivities(q, 0)) {
                String l = ri.loadLabel(pm).toString(), ll = l.toLowerCase();
                if (ll.equals(nn)) { best = ri.activityInfo.packageName; bl = l; break; }
                if (best == null && ll.length() >= 3 && (ll.contains(nn) || nn.contains(ll))) { best = ri.activityInfo.packageName; bl = l; }
              }
              if (best == null) return null;
              Intent i = pm.getLaunchIntentForPackage(best);
              if (i == null) return null;
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(i); return bl;
            }
            String installedLabels() {
              PackageManager pm = getPackageManager();
              Intent q = new Intent(Intent.ACTION_MAIN); q.addCategory(Intent.CATEGORY_LAUNCHER);
              TreeSet<String> t = new TreeSet<>();
              for (ResolveInfo ri : pm.queryIntentActivities(q, 0)) t.add(ri.loadLabel(pm).toString());
              String j = String.join(", ", t);
              return j.length() > 900 ? j.substring(0, 900) : j;
            }
            void doAccess(int id, String cmd, String args) {
              JarvisAccess s = JarvisAccess.inst;
              if (s == null) { res(id, "Phone control is off. Ask the user to turn on Jarvis under Settings > Accessibility."); return; }
              try {
                JSONObject a = new JSONObject(args);
                Runnable no = () -> res(id, "The user denied that.");
                switch (cmd) {
                  case "click": { int i = a.getInt("id"); s.guard("tap", s.desc(i), () -> after(id, s, s.click(i)), no); break; }
                  case "type": { int i = a.getInt("id"); String t = a.getString("text"); s.guard("type", null, () -> after(id, s, s.type(i, t)), no); break; }
                  case "scroll": { boolean dn = !"up".equals(a.optString("dir", "down")); s.guard("scroll", null, () -> after(id, s, s.scroll(dn)), no); break; }
                  case "launch": { String nm = a.getString("name"); s.guard("open an app", null, () -> { String l = launchByName(nm); if (l == null) { res(id, "No installed app matches \"" + nm + "\". Installed apps: " + installedLabels()); return; } h.postDelayed(() -> { String r = s.read(); if (r.startsWith("APP: com.jarvis.app")) r = "Could not bring that app to the front. " + r; res(id, r); }, 2500); }, no); break; }
                  case "read": s.guard("read the screen", null, () -> res(id, s.read()), no); break;
                  default: s.guard("press " + cmd, null, () -> after(id, s, s.global(cmd)), no);
                }
              } catch (Exception e) { res(id, "Error: " + e.getMessage()); }
            }
            void after(int id, JarvisAccess s, String r) { h.postDelayed(() -> res(id, r + "\n" + s.read()), 1200); }
            class Bridge {
              @JavascriptInterface public void browse(int id, String cmd, String args) { h.post(() -> doBrowse(id, cmd, args)); }
              @JavascriptInterface public void access(int id, String cmd, String args) { h.post(() -> doAccess(id, cmd, args)); }
              @JavascriptInterface public boolean accessOn() { return JarvisAccess.inst != null; }
              @JavascriptInterface public void speak(String t) { h.post(() -> { if (tts != null) tts.speak(t.length() > 3500 ? t.substring(0, 3500) : t, TextToSpeech.QUEUE_FLUSH, null, "j"); }); }
              @JavascriptInterface public String launchApp(String n) {
                try { String l = launchByName(n); return l == null ? "No installed app matches \"" + n + "\". Installed apps: " + installedLabels() : "Opened " + l + "."; }
                catch (Exception e) { return "Could not open it: " + e.getMessage(); }
              }
              @JavascriptInterface public void openAccessSettings() { h.post(() -> { Intent i = new Intent(android.provider.Settings.ACTION_ACCESSIBILITY_SETTINGS); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(i); }); }
              @JavascriptInterface public void launch(String url) { h.post(() -> MainActivity.this.launch(url)); }
              @JavascriptInterface public void fetchUrl(int id, String url) {
                new Thread(() -> {
                  String r;
                  try {
                    HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                    c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14) Chrome/120 Mobile Safari/537.36");
                    c.setConnectTimeout(15000); c.setReadTimeout(15000);
                    BufferedReader rd = new BufferedReader(new InputStreamReader(c.getInputStream()));
                    StringBuilder sb = new StringBuilder(); String l;
                    while ((l = rd.readLine()) != null && sb.length() < 400000) sb.append(l).append('\n');
                    r = sb.toString().replaceAll("(?is)<(script|style)[^>]*>.*?</\\1>", "").replaceAll("(?s)<[^>]+>", " ").replaceAll("\\s+", " ").trim();
                    if (r.length() > 8000) r = r.substring(0, 8000);
                  } catch (Exception e) { r = "Fetch failed: " + e.getMessage(); }
                  res(id, r);
                }).start();
              }
              @JavascriptInterface public void listen() {
                h.post(() -> {
                  Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  try { startActivityForResult(i, 1); } catch (Exception e) { js("window.onVoice&&onVoice('')"); }
                });
              }
              @JavascriptInterface public String saveFile(String name, String text) {
                try {
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                  v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                  Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                  OutputStream o = getContentResolver().openOutputStream(u); o.write(text.getBytes("UTF-8")); o.close();
                  return "Saved to the Downloads folder as " + name;
                } catch (Exception e) { return "Save failed: " + e.getMessage(); }
              }
            }

            @Override protected void onActivityResult(int rq, int rs, Intent d) {
              if (rq == 1) {
                String t = "";
                if (rs == RESULT_OK && d != null) { ArrayList<String> l = d.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS); if (l != null && !l.isEmpty()) t = l.get(0); }
                js("window.onVoice&&onVoice(" + JSONObject.quote(t) + ")");
              } else if (rq == 2 && chooser != null) {
                chooser.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(rs, d)); chooser = null;
              }
            }
          }
          EOF
          mkdir -p proj/app/src/main/res/drawable proj/app/src/main/res/mipmap-anydpi-v26
          cat > proj/app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0F4C5C" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          cat > proj/app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#E09F3E" android:fillType="evenOdd" android:pathData="M54,28a26,26 0 1,1 0,52a26,26 0 1,1 0,-52z M54,35a19,19 0 1,0 0,38a19,19 0 1,0 0,-38z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M54,46a8,8 0 1,1 0,16a8,8 0 1,1 0,-16z"/>
          </vector>
          EOF
          cat > proj/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_bg"/>
            <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
          mkdir -p proj/app/src/main/res/xml proj/app/src/main/res/values
          cat > proj/app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeAllMask"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews"
            android:canRetrieveWindowContent="true"
            android:notificationTimeout="100"
            android:description="@string/access_desc"/>
          EOF
          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
            <string name="access_desc">Lets Jarvis read the screen and tap or type in apps when you ask it to.</string>
          </resources>
          EOF
          cat > proj/app/src/main/java/com/jarvis/app/JarvisAccess.java <<'EOF'
          package com.jarvis.app;
          import android.accessibilityservice.AccessibilityService;
          import android.content.Intent;
          import android.graphics.PixelFormat;
          import android.os.*;
          import android.view.*;
          import android.view.accessibility.*;
          import android.widget.*;
          import java.util.*;
          import java.util.regex.Pattern;

          public class JarvisAccess extends AccessibilityService {
            static JarvisAccess inst;
            List<AccessibilityNodeInfo> nodes = new ArrayList<>();
            long until = 0;
            static final Pattern SENS = Pattern.compile("(?i)\\b(send|pay|buy|purchase|order|confirm|delete|remove|post|submit|transfer|checkout|book|subscribe|uninstall|sign out|log out)\\b");

            @Override protected void onServiceConnected() { inst = this; }
            @Override public void onAccessibilityEvent(AccessibilityEvent e) {}
            @Override public void onInterrupt() {}
            @Override public boolean onUnbind(Intent i) { inst = null; return super.onUnbind(i); }

            String label(AccessibilityNodeInfo n) {
              CharSequence t = n.getText(), c = n.getContentDescription();
              String s = (t != null ? t : (c != null ? c : "")).toString().trim();
              return s.length() > 80 ? s.substring(0, 80) : s;
            }
            String read() {
              nodes.clear();
              AccessibilityNodeInfo r = getRootInActiveWindow();
              if (r == null) return "The screen can't be read right now.";
              StringBuilder sb = new StringBuilder("APP: " + r.getPackageName() + "\n");
              walk(r, sb);
              return sb.toString();
            }
            void walk(AccessibilityNodeInfo n, StringBuilder sb) {
              if (n == null || sb.length() > 4000 || nodes.size() >= 80) return;
              String l = label(n);
              boolean act = n.isClickable() || n.isEditable() || n.isCheckable();
              if (n.isVisibleToUser() && (act || !l.isEmpty())) {
                if (act) {
                  nodes.add(n);
                  sb.append(nodes.size() - 1).append(": ").append(n.isEditable() ? "[input] " : "[tap] ").append(l).append(n.isPassword() ? " (password)" : "").append('\n');
                } else sb.append("- ").append(l).append('\n');
              }
              for (int i = 0; i < n.getChildCount(); i++) walk(n.getChild(i), sb);
            }
            String desc(int i) { return i >= 0 && i < nodes.size() ? label(nodes.get(i)) : null; }
            String click(int i) {
              if (i < 0 || i >= nodes.size()) return "No such item; read the screen again.";
              boolean ok = false;
              for (AccessibilityNodeInfo p = nodes.get(i); p != null && !ok; p = p.getParent()) ok = p.performAction(AccessibilityNodeInfo.ACTION_CLICK);
              return ok ? "Tapped." : "Could not tap that.";
            }
            String type(int i, String t) {
              if (i < 0 || i >= nodes.size()) return "No such item; read the screen again.";
              AccessibilityNodeInfo n = nodes.get(i);
              if (n.isPassword()) return "Blocked: the user must type passwords themselves.";
              Bundle b = new Bundle();
              b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, t);
              return n.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b) ? "Typed." : "Could not type there.";
            }
            AccessibilityNodeInfo scrollable(AccessibilityNodeInfo n) {
              if (n == null) return null;
              if (n.isScrollable()) return n;
              for (int i = 0; i < n.getChildCount(); i++) { AccessibilityNodeInfo r = scrollable(n.getChild(i)); if (r != null) return r; }
              return null;
            }
            String scroll(boolean down) {
              AccessibilityNodeInfo s = scrollable(getRootInActiveWindow());
              if (s == null) return "Nothing to scroll.";
              return s.performAction(down ? AccessibilityNodeInfo.ACTION_SCROLL_FORWARD : AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD) ? "Scrolled." : "Could not scroll.";
            }
            String global(String w) {
              int a = "back".equals(w) ? GLOBAL_ACTION_BACK : "home".equals(w) ? GLOBAL_ACTION_HOME : "recents".equals(w) ? GLOBAL_ACTION_RECENTS : -1;
              if (a < 0) return "Unknown navigation.";
              performGlobalAction(a);
              return "Done.";
            }

            boolean sessionOk() { return System.currentTimeMillis() < until; }
            void guard(String what, String target, Runnable run, Runnable deny) {
              boolean sens = target != null && SENS.matcher(target).find();
              if (sessionOk() && !sens) { until = System.currentTimeMillis() + 300000; run.run(); return; }
              String msg = sens ? "Jarvis wants to " + what + " \"" + target + "\". Allow?" : "Allow Jarvis to control your phone for 5 minutes?";
              ask(msg, () -> { until = System.currentTimeMillis() + 300000; run.run(); }, deny);
            }
            void ask(String msg, Runnable yes, Runnable no) {
              WindowManager wm = (WindowManager) getSystemService(WINDOW_SERVICE);
              LinearLayout box = new LinearLayout(this);
              box.setOrientation(LinearLayout.VERTICAL); box.setBackgroundColor(0xEE0F4C5C); box.setPadding(40, 30, 40, 30);
              TextView tv = new TextView(this); tv.setText(msg); tv.setTextColor(0xFFFFFFFF); tv.setTextSize(16);
              LinearLayout row = new LinearLayout(this);
              Button y = new Button(this); y.setText("Allow");
              Button n = new Button(this); n.setText("Deny");
              row.addView(y); row.addView(n); box.addView(tv); box.addView(row);
              WindowManager.LayoutParams p = new WindowManager.LayoutParams(-1, -2, WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
              p.gravity = Gravity.BOTTOM;
              y.setOnClickListener(v -> { wm.removeView(box); yes.run(); });
              n.setOnClickListener(v -> { wm.removeView(box); no.run(); });
              wm.addView(box, p);
              new Handler(Looper.getMainLooper()).postDelayed(() -> { if (box.isAttachedToWindow()) { wm.removeView(box); no.run(); } }, 30000);
            }
          }
          EOF
      - name: Build APK
        shell: bash
        run: |
          cp index.html proj/app/src/main/assets/index.html
          cp jarvis.keystore proj/app/jarvis.keystore
          cat -n proj/app/build.gradle | head -14
          cd proj && gradle assembleRelease --no-daemon --console=plain 2>&1 | tee ../build.log
      - name: Show errors
        if: failure()
        run: |
          (grep -E "^e: |error:|What went wrong|Execution failed|AAPT" -A3 build.log || tail -15 build.log) | head -16 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: proj/app/build/outputs/apk/release/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Jarvis APK (latest)
          files: proj/app/build/outputs/apk/release/app-release.apk
