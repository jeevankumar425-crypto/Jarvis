name: Build native apps
on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-apps
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: jarvis.keystore
          key: jarvis-keystore-v1
      - name: Create signing key once
        run: |
          [ -f jarvis.keystore ] || keytool -genkeypair -keystore jarvis.keystore -storepass jarvis123 -keypass jarvis123 -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Jarvis"
      - name: Write app template
        run: |
          mkdir -p tpl
          cat > tpl/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'App'
          include ':app'
          EOF
          cat > tpl/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > tpl/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF
          cat > tpl/app.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.jarvis.app'
            compileSdk 34
            defaultConfig {
              applicationId '__APPID__'
              minSdk 29
              targetSdk 34
              versionCode 1000 + (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
              versionName '1.0'
            }
            signingConfigs { release { storeFile file('jarvis.keystore'); storePassword 'jarvis123'; keyAlias 'jarvis'; keyPassword 'jarvis123' } }
            buildTypes { release { signingConfig signingConfigs.release } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            lint { checkReleaseBuilds false; abortOnError false }
          }
          EOF
          cat > tpl/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>
            <application android:label="__LABEL__" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize" android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > tpl/ic_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0F4C5C" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          cat > tpl/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#E09F3E" android:fillType="evenOdd" android:pathData="M54,28a26,26 0 1,1 0,52a26,26 0 1,1 0,-52z M54,35a19,19 0 1,0 0,38a19,19 0 1,0 0,-38z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M54,46a8,8 0 1,1 0,16a8,8 0 1,1 0,-16z"/>
          </vector>
          EOF
          cat > tpl/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_bg"/>
            <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
          cat > tpl/MainActivity.java <<'EOF'
          package com.jarvis.app;
          import android.app.Activity;
          import android.content.*;
          import android.net.Uri;
          import android.os.*;
          import android.provider.MediaStore;
          import android.speech.tts.*;
          import android.webkit.*;
          import android.widget.*;
          import java.io.*;

          public class MainActivity extends Activity {
            WebView w; TextToSpeech tts; ValueCallback<Uri[]> chooser;

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);
              s.setAllowUniversalAccessFromFileURLs(true); s.setAllowFileAccessFromFileURLs(true);
              w.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  String u = r.getUrl().toString();
                  if (u.startsWith("file:")) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u))); } catch (Exception e) {}
                  return true;
                }
              });
              w.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  chooser = cb;
                  try { startActivityForResult(p.createIntent(), 2); } catch (Exception e) { chooser = null; return false; }
                  return true;
                }
                @Override public boolean onJsAlert(WebView v, String u, String m, JsResult r) {
                  Toast.makeText(MainActivity.this, m, Toast.LENGTH_LONG).show(); r.confirm(); return true;
                }
              });
              tts = new TextToSpeech(this, st -> {});
              w.addJavascriptInterface(new Bridge(), "Android");
              setContentView(w);
              w.loadUrl("file:///android_asset/index.html");
            }

            @Override public void onBackPressed() { if (w.canGoBack()) w.goBack(); else super.onBackPressed(); }

            @Override protected void onActivityResult(int rq, int rs, Intent d) {
              if (rq == 2 && chooser != null) { chooser.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(rs, d)); chooser = null; }
            }

            class Bridge {
              @JavascriptInterface public void toast(String t) { runOnUiThread(() -> Toast.makeText(MainActivity.this, t, Toast.LENGTH_SHORT).show()); }
              @JavascriptInterface public void speak(String t) { tts.speak(t, TextToSpeech.QUEUE_FLUSH, null, "j"); }
              @JavascriptInterface public void copy(String t) { runOnUiThread(() -> { ((ClipboardManager) getSystemService(CLIPBOARD_SERVICE)).setPrimaryClip(ClipData.newPlainText("App", t)); Toast.makeText(MainActivity.this, "Copied", Toast.LENGTH_SHORT).show(); }); }
              @JavascriptInterface public void share(String t) { runOnUiThread(() -> { Intent i = new Intent(Intent.ACTION_SEND); i.setType("text/plain"); i.putExtra(Intent.EXTRA_TEXT, t); startActivity(Intent.createChooser(i, "Share")); }); }
              @JavascriptInterface public void vibrate(int ms) { ((Vibrator) getSystemService(VIBRATOR_SERVICE)).vibrate(ms); }
              @JavascriptInterface public void openUrl(String u) { runOnUiThread(() -> { try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u))); } catch (Exception e) {} }); }
              @JavascriptInterface public String saveFile(String name, String text) {
                try {
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                  v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                  Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                  OutputStream o = getContentResolver().openOutputStream(u); o.write(text.getBytes("UTF-8")); o.close();
                  return "Saved to Downloads/" + name;
                } catch (Exception e) { return "Save failed: " + e.getMessage(); }
              }
            }
          }
          EOF
      - name: Build every native app
        shell: bash
        run: |
          set -e
          mkdir -p out
          for d in native/*/ ; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            id=$(echo "$name" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9')
            [ -n "$id" ] || continue
            LABEL=$(head -n1 "${d}app.txt" 2>/dev/null | tr -d '"<>&|/\\' || true)
            [ -n "$LABEL" ] || LABEL="$name"
            P="$PWD/work/$id"
            rm -rf "$P"
            mkdir -p "$P/app/src/main/java/com/jarvis/app" "$P/app/src/main/assets" "$P/app/src/main/res/drawable" "$P/app/src/main/res/mipmap-anydpi-v26"
            cp tpl/settings.gradle tpl/build.gradle tpl/gradle.properties "$P/"
            sed "s|__APPID__|com.jarvis.gen.$id|g" tpl/app.gradle > "$P/app/build.gradle"
            sed "s|__LABEL__|$LABEL|g" tpl/AndroidManifest.xml > "$P/app/src/main/AndroidManifest.xml"
            cp tpl/MainActivity.java "$P/app/src/main/java/com/jarvis/app/"
            cp tpl/ic_bg.xml tpl/ic_fg.xml "$P/app/src/main/res/drawable/"
            cp tpl/ic_launcher.xml "$P/app/src/main/res/mipmap-anydpi-v26/"
            cp -r "${d}." "$P/app/src/main/assets/"
            if [ -d "${d}java" ]; then cp "${d}"java/*.java "$P/app/src/main/java/com/jarvis/app/"; rm -rf "$P/app/src/main/assets/java"; fi
            if [ -f "${d}AndroidManifest.xml" ]; then cp "${d}AndroidManifest.xml" "$P/app/src/main/AndroidManifest.xml"; rm -f "$P/app/src/main/assets/AndroidManifest.xml"; fi
            rm -f "$P/app/src/main/assets/app.txt"
            cp jarvis.keystore "$P/app/"
            if (cd "$P" && gradle assembleRelease --no-daemon --console=plain > "$PWD/../$id.log" 2>&1); then
              cp "$P/app/build/outputs/apk/release/app-release.apk" "out/$id.apk"
              echo "Built $name"
            else
              echo "::error::Build failed for $name"
              (grep -E "error:|What went wrong|Could not|not found" -A3 "$PWD/work/$id.log" || tail -15 "$PWD/work/$id.log") | head -14 | while IFS= read -r l; do echo "::error::$l"; done
            fi
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        if: hashFiles('out/*.apk') != ''
        with:
          name: Native-APKs
          path: out/*.apk
      - uses: softprops/action-gh-release@v2
        if: hashFiles('out/*.apk') != ''
        with:
          tag_name: native-apps
          name: Jarvis native apps
          files: out/*.apk
