<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tip Calculator</title>
<style>
  body {font-family:Arial,sans-serif; max-width:400px; margin:20px auto; padding:10px;}
  label, input, select, button {display:block; width:100%; margin:8px 0;}
  .result {margin-top:12px; font-weight:bold;}
</style>
</head>
<body>
<h2>Simple Tip Calculator</h2>
<label for="bill">Bill amount:</label>
<input type="number" id="bill" placeholder="e.g. 100" step="0.01" min="0">
<label for="tip">Tip %:</label>
<select id="tip">
  <option value="10">10%</option>
  <option value="15" selected>15%</option>
  <option value="18">18%</option>
  <option value="20">20%</option>
</select>
<button onclick="calculate()">Calculate</button>
<div class="result" id="output"></div>
<script>
function calculate(){
  const bill = parseFloat(document.getElementById('bill').value)||0;
  const tipPercent = parseFloat(document.getElementById('tip').value);
  const tip = bill * tipPercent / 100;
  const total = bill + tip;
  document.getElementById('output').innerHTML =
    `Tip: $${tip.toFixed(2)}<br>Total: $${total.toFixed(2)}`;
}
</script>
</body>
</html>
