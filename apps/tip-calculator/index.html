<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tip Calculator</title>
<style>
  body {font-family:Arial,Helvetica,sans-serif;max-width:400px;margin:20px auto;padding:10px;border:1px solid #ccc;border-radius:8px;}
  input,select{width:100%;padding:8px;margin:5px 0;}
  button{padding:10px;width:100%;background:#4CAF50;color:white;border:none;border-radius:4px;cursor:pointer;}
  .result{margin-top:15px;font-weight:bold;}
</style>
</head>
<body>
<h2>Simple Tip Calculator</h2>
<label>Bill amount ($):<input type="number" id="bill" min="0" step="0.01" placeholder="e.g., 50"></label>
<label>Tip %:<input type="number" id="tip" min="0" step="1" placeholder="e.g., 15"></label>
<label>People:<input type="number" id="people" min="1" step="1" value="1"></label>
<button onclick="calculate()">Calculate</button>
<div class="result" id="output"></div>
<script>
function calculate(){
  const bill=parseFloat(document.getElementById('bill').value)||0;
  const tipPercent=parseFloat(document.getElementById('tip').value)||0;
  const people=parseInt(document.getElementById('people').value)||1;
  const tipAmount=bill*tipPercent/100;
  const total=bill+tipAmount;
  const perPerson=total/people;
  document.getElementById('output').innerHTML=`Tip: $${tipAmount.toFixed(2)}<br>Total: $${total.toFixed(2)}<br>Per person: $${perPerson.toFixed(2)}`;
}
</script>
</body>
</html>
